name: scrape

# Primary trigger is an external cron (cron-job.org) hitting workflow_dispatch
# every hour — GitHub's own scheduler is best-effort and silently drops/delays
# scheduled runs, which left us closer to every ~1.5h. See docs/ops-scrape-cron.md.
#
# This `schedule` is now only a FALLBACK: every 6 hours, so that if the external
# cron ever goes down the data still refreshes (and never goes badly stale)
# without redundantly doubling the reliable hourly external trigger.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Don't pile up runs if one is still going.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  # The `schedule` trigger only exists to cover an external-cron outage. While the
  # hourly dispatch is alive the fallback has nothing to add: GitHub delivers it
  # late enough to queue behind the hourly run, so it re-scrapes twelve small
  # vendor sites minutes after they were just scraped, burns ~7 minutes of Actions
  # time, and races the hourly run for the same regenerated data files. Skip it
  # while the published snapshot is fresh; every other trigger always runs.
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the snapshot is needed, and only for its generated_at header.
          sparse-checkout: data/snapshot.json
          sparse-checkout-cone-mode: false
      - id: check
        env:
          # The fallback fires 6-hourly; anything under this means the hourly
          # external cron delivered recently and is doing its job.
          MAX_FRESH_MINUTES: "90"
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }} — scraping."
            exit 0
          fi
          # Fail OPEN: if the age can't be read for any reason, scrape. A missed
          # refresh is a real outage; a redundant one only costs minutes.
          age=$(python3 -c "import datetime as dt, json; print(int((dt.datetime.now(dt.UTC) - dt.datetime.fromisoformat(json.load(open('data/snapshot.json'))['generated_at'])).total_seconds() // 60))" 2>/dev/null || echo unknown)
          if [ "$age" != "unknown" ] && [ "$age" -lt "$MAX_FRESH_MINUTES" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot is ${age}m old (< ${MAX_FRESH_MINUTES}m) — the hourly cron is healthy, so this fallback run is redundant. Skipping." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if [ "$age" = "unknown" ]; then
              why="the snapshot's age could not be read"
            else
              why="the snapshot is ${age}m old (>= ${MAX_FRESH_MINUTES}m)"
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running the fallback scrape — ${why}, so the hourly cron is not delivering." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  scrape:
    needs: decide
    # Fail OPEN, twice over: scrape unless `decide` positively said not to. A
    # plain `== 'true'` would turn any failure in that job — a checkout blip, a
    # runner dying — into a silently skipped scrape, which is a worse outage than
    # the redundant run the check exists to avoid.
    if: ${{ !cancelled() && needs.decide.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the alerting step open/comment/close a tracking issue when a
      # vendor degrades (carry-forward) or fails outright.
      issues: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Need a real token (not GITHUB_TOKEN's default) to push back, OR
          # set permissions: contents: write above. We've done the latter.
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Refresh ThrustCurve catalog
        # Always run this — the SQLite DB is gitignored so each runner starts
        # empty, and we need motors loaded before scrape→match can succeed.
        # ``actions/checkout`` resets file mtimes to "now," so an mtime-based
        # "skip if fresh" check never triggered and silently produced
        # snapshots where every listing was unmatched. The refresh itself is
        # a single HTTP request (~2s, 273 records) — cheap to always run.
        run: hpr catalog refresh

      - name: Scrape all vendors
        # Fail-over egress: every vendor scrapes DIRECT and only escalates if a host
        # 429/403s the CI data-center IP (see PoliteAsyncClient). Order:
        #   1. Cloudflare Worker relay (SCRAPER_RELAY_URL) — free, clean egress IP.
        #   2. Residential proxy (SCRAPER_PROXY_URL) — metered, last resort.
        # Any unset secret just skips that tier. Nothing engages while vendors are
        # healthy; it kicks in automatically for whichever vendor gets blocked.
        env:
          SCRAPER_RELAY_URL: ${{ secrets.SCRAPER_RELAY_URL }}
          SCRAPER_RELAY_SECRET: ${{ secrets.SCRAPER_RELAY_SECRET }}
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
        run: hpr scrape run all

      - name: Export snapshot (resilient to a flaky vendor)
        # A vendor that scrapes below the floor (AMW/Sirius intermittently
        # return 0 when blocked from CI data-center IPs) keeps its last-good
        # listings from the previously-committed data/snapshot.json instead of
        # vanishing — so healthy vendors' fresh data still publishes every run.
        # The export only fails (and skips the commit) if a below-floor vendor
        # has NO prior data to fall back on. The floor (200) is well above a
        # rate-limited-mid-walk run (~20% of normal) but below a healthy run.
        working-directory: ${{ github.workspace }}
        # --report-json writes machine-readable per-vendor health that the
        # alerting step reads. It's written even when export exits non-zero
        # (refuse-to-publish), so the alert still fires on a total failure.
        run: hpr snapshot export --floor 200 --report-json data/scrape-status.json

      - name: Validate snapshot before publishing
        # Belt-and-suspenders on top of --floor: never commit a snapshot that
        # isn't parseable JSON with a non-empty motors array. A truncated/corrupt
        # file (partial write, disk hiccup) would otherwise auto-deploy and 500
        # every page (loadSnapshot throws on malformed JSON). Failing here skips
        # the commit; the previously-published snapshot stays live.
        working-directory: ${{ github.workspace }}
        run: |
          python -c "import json,sys; d=json.load(open('data/snapshot.json')); n=len(d.get('motors') or []); print(f'snapshot OK: {n} motors'); sys.exit(0 if n>0 else 1)"

      - name: Report scrape health
        # always() so it runs even when the export step exited non-zero. Writes a
        # one-line health note to the run summary every time, and opens a single
        # tracking issue ONLY when a vendor's data has been stale beyond the
        # threshold (a sustained outage, not a transient carry-forward). The
        # issue auto-closes on recovery. Total failures exit non-zero and are
        # covered by GitHub's native workflow-failure email.
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          # The tracking issue @mentions and is assigned to the repo owner, so the
          # alert notifies reliably even with a "participating only" watch.
          OWNER: ${{ github.repository_owner }}
        # Second arg is the stale-hours threshold that opens an issue.
        run: bash .github/scripts/alert_on_degraded.sh data/scrape-status.json 6

      - name: Update stock/price history
        # Append this run's stock/price changes to the per-listing history log.
        # No `if: always()` on purpose: the export step exits non-zero on a
        # refuse-to-publish run, which short-circuits the job here so history
        # never ingests an unpublished snapshot. On a carry-forward run the
        # snapshot DID publish but carried listings are byte-identical, so this
        # records nothing (idempotent) — correct by design.
        working-directory: ${{ github.workspace }}
        run: hpr history update --snapshot-path data/snapshot.json

      - name: Send restock email alerts (best-effort)
        # Diff the previously-published snapshot (git HEAD, before this run's
        # commit) against the freshly-written one and notify subscribers of
        # motors that came back in stock. No-op unless the dispatch secrets are
        # set; continue-on-error so alerts can never block the snapshot commit.
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        env:
          ALERTS_DISPATCH_URL: ${{ secrets.ALERTS_DISPATCH_URL }}
          ALERTS_DISPATCH_SECRET: ${{ secrets.ALERTS_DISPATCH_SECRET }}
        run: |
          git show HEAD:data/snapshot.json > /tmp/prev_snapshot.json 2>/dev/null || echo '{}' > /tmp/prev_snapshot.json
          hpr alerts dispatch --prev /tmp/prev_snapshot.json --current data/snapshot.json

      - name: Commit changes if any
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit ALL three manufacturer caches (not just AeroTech) — each is
          # rewritten by `catalog refresh` and is the stale-cache fallback if
          # ThrustCurve is down; omitting cesaroni/loki let those rot (and once
          # corrupted the Loki cache). The glob also covers future manufacturers.
          # health-baseline.json is the rolling per-vendor count/in-stock
          # baseline that powers below-baseline anomaly detection; it's rewritten
          # each run and must persist across runs to learn.
          DATA_PATHS=(data/snapshot.json data/thrustcurve_*.json
                      data/history/log.json data/history/summary.json
                      data/health-baseline.json)

          commit_and_push() {
            git add "${DATA_PATHS[@]}"
            # No-op when scrape produced no changes (e.g. all vendors quiet).
            if git diff --cached --quiet; then
              echo "no changes to commit"
              return 0
            fi
            # [skip ci] keeps the regular test workflow from running on these
            # data-only commits — saves Actions minutes and avoids noise.
            git commit -q -m "Hourly scrape: refresh snapshot [skip ci]"
            git push
          }

          # A concurrent scrape can land its own commit between our checkout and
          # our push. Rebasing is the wrong tool for it: every file above is
          # regenerated whole each run, so replaying our commit over another run's
          # means a three-way merge of two complete snapshots — it conflicts on
          # every one of them, which is exactly how an overlapping run used to die
          # (red X, data dropped, nothing published). Rebuild the commit on the new
          # tip instead and let the newer, internally-consistent set win outright.
          for attempt in 1 2 3; do
            if commit_and_push; then exit 0; fi
            echo "push rejected — replaying this run's data on the updated main (attempt ${attempt})"
            git fetch origin main
            # --mixed moves HEAD and the index to the new tip but leaves the working
            # tree — i.e. THIS run's freshly generated files — alone. Only the data
            # paths are re-staged, so a code commit that landed alongside us is
            # carried forward rather than reverted.
            git reset --mixed --quiet FETCH_HEAD
            sleep $((attempt * 3))
          done
          echo "::error::could not push this run's scrape results after 3 attempts"
          exit 1
